<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أسعار ألبان ومخللات حي دراغ</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--tx:#2b2418;--mu:#7a6f5d;--ac:#b4561f;--ac2:#2f7d4f;--bd:#e6dccb;--in:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1812;--card:#26221a;--tx:#f1e9d9;--mu:#a89d88;--ac:#e07a3c;--ac2:#5fbf86;--bd:#3a3427;--in:#1f1b14}}
:root[data-theme="dark"]{--bg:#1b1812;--card:#26221a;--tx:#f1e9d9;--mu:#a89d88;--ac:#e07a3c;--ac2:#5fbf86;--bd:#3a3427;--in:#1f1b14}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:16px}
header{padding:16px 14px 8px}
h1{margin:0;font-size:20px;color:var(--ac)}
.sub{color:var(--mu);font-size:13px;margin-top:2px}
.bar{display:flex;gap:8px;padding:8px 14px;flex-wrap:wrap}
input,select,button{font:inherit}
input,select{background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
.bar input{flex:1 1 180px}.bar select{flex:0 1 140px}
button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--ac);color:#fff}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.del{background:#b3261e}
.stats{padding:0 14px;color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:12px 14px 90px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer}
.img{aspect-ratio:1;background:var(--bd) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--mu)}
.b{padding:8px 10px}
.n{font-weight:700;font-size:15px;margin-bottom:2px}
.c{font-size:12px;color:var(--mu);margin-bottom:6px}
.p{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
.p b{font-size:14px}.w b{color:var(--ac)}.r b{color:var(--ac2)}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px 10px}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;width:58px;height:58px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.on{display:flex}
.md{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pv{width:100%;aspect-ratio:16/10;border:1px dashed var(--bd);border-radius:12px;background:var(--in) center/contain no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mu);cursor:pointer}
.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chips button{padding:8px 12px}
.rs{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;margin-top:8px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.rs b{font-size:18px}.rs.w b{color:var(--ac)}.rs.r b{color:var(--ac2)}
#cam{position:fixed;inset:0;background:#000;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;padding:env(safe-area-inset-top,0px) 10px env(safe-area-inset-bottom,0px)}
.sq{width:min(100%,58vh);aspect-ratio:1;position:relative;overflow:hidden;border-radius:12px;background:#111}
.sq video{width:100%;height:100%;object-fit:cover}
.sq i{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33%,rgba(255,255,255,.35) 33%,rgba(255,255,255,.35) calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,rgba(255,255,255,.35) 66%,rgba(255,255,255,.35) calc(66% + 1px),transparent calc(66% + 1px)),linear-gradient(transparent 33%,rgba(255,255,255,.35) 33%,rgba(255,255,255,.35) calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,rgba(255,255,255,.35) 66%,rgba(255,255,255,.35) calc(66% + 1px),transparent calc(66% + 1px));border:2px solid rgba(255,255,255,.6);border-radius:12px}
.tips{font-size:13px;text-align:center;line-height:1.7;opacity:.9;max-width:420px}
.cbar{display:flex;align-items:center;justify-content:space-around;width:100%;max-width:420px}
.cbar button{background:#ffffff22;color:#fff;border-radius:50%;width:52px;height:52px;padding:0;font-size:22px}
.cbar button.sh{width:74px;height:74px;background:#fff;border:5px solid #ffffff88;background-clip:padding-box}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;display:none;z-index:9}
</style>
</head>
<body>
<header>
<h1>🧀 ألبان ومخللات حي دراغ</h1>
<div class="sub">قائمة الأسعار — الجملة والمفرد (بالدينار)</div>
</header>
<div class="bar">
<input id="q" placeholder="🔍 ابحث عن مادة...">
<select id="cf"><option value="">كل الأصناف</option></select>
</div>
<div class="bar">
<button class="sec" id="exp">⬇ نسخة احتياطية</button>
<button class="sec" id="imp">⬆ استرجاع</button>
<input type="file" id="impf" accept=".json" hidden>
<button class="sec" id="lo">خروج</button>
</div>
<div class="stats" id="st"></div>
<div class="grid" id="g"></div>
<button class="fab" id="add" aria-label="إضافة">+</button>

<div class="ov" id="ov"><div class="md">
<h2 id="mt" style="margin:0 0 4px">مادة جديدة</h2>
<div class="pv" id="pv" style="cursor:default;aspect-ratio:1;max-width:240px;margin:0 auto">📷 لا توجد صورة</div>
<div class="two" style="margin-top:8px"><button id="pcam">📷 التقاط بالكاميرا</button><button class="sec" id="pgal">🖼 من المعرض</button></div>
<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="enh" checked style="width:auto"> تحسين تلقائي للإضاءة والألوان</label>
<input type="file" id="pf" accept="image/*" hidden>
<input type="file" id="cf2" accept="image/*" capture="environment" hidden>
<label>اسم المادة</label><input id="nm" placeholder="مثال: جبن أبيض">
<label>الصنف</label><input id="ct" list="cl" placeholder="ألبان، مخللات، فطور، مكسرات...">
<datalist id="cl"><option value="ألبان"><option value="مخللات"><option value="فطور"><option value="مكسرات"><option value="أخرى"></datalist>
<label>طريقة البيع</label>
<select id="uk"><option value="kg">بالوزن (الأسعار للكيلو، ويُباع بالغرام)</option><option value="pc">بالقطعة / العلبة</option></select>
<label>ملاحظة (اختياري)</label><input id="un" placeholder="مثال: علبة كبيرة، محلي، مستورد">
<label>سعر الشراء / التكلفة (قبل البيع)</label><input id="pc" type="number" inputmode="numeric" min="0" step="any">
<div class="two">
<div><label>سعر الجملة</label><input id="pw" type="number" inputmode="numeric" min="0" step="any"></div>
<div><label>سعر المفرد</label><input id="pr" type="number" inputmode="numeric" min="0" step="any"></div>
</div>
<div class="row"><button id="sv">حفظ</button><button class="sec" id="cn">إلغاء</button><button class="del" id="dl" style="display:none">حذف</button></div>
</div></div>
<div class="ov" id="ov2"><div class="md">
<div class="pv" id="cimg" style="cursor:default;aspect-ratio:2/1;font-size:34px"></div>
<h2 id="cnm" style="margin:10px 0 2px"></h2>
<div class="sub" id="cinf"></div>
<label id="ql"></label><input id="qty" type="number" inputmode="decimal" min="0">
<div class="chips" id="chips"></div>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rd" checked style="width:auto"> تقريب السعر لأقرب 250 دينار</label>
<div id="rsl"></div>
<div style="border-top:1px solid var(--bd);margin-top:16px"></div>
<label id="al">أو اكتب المبلغ بالدينار (كم غرام يأخذ؟)</label><input id="amt" type="number" inputmode="numeric" min="0" placeholder="مثال: 2000">
<div class="chips" id="achips"></div>
<div id="arsl"></div>
<div class="row"><button id="ce">تعديل المادة</button><button class="sec" id="cc">إغلاق</button></div>
</div></div>
<div class="ov on" id="lg"><div class="md">
<h2 style="margin:0 0 4px">تسجيل الدخول</h2>
<label>رقم الهاتف</label><input id="lph" inputmode="tel" autocomplete="username">
<label>كلمة المرور</label><input id="lpw" type="password" autocomplete="current-password">
<div class="row"><button id="lgb">دخول</button></div>
<div class="sub" id="lerr" style="color:#b3261e;margin-top:10px"></div>
</div></div>
<div id="cam">
<div class="tips">ضع المادة في منتصف المربع • خلفية فاتحة ونظيفة (ورقة بيضاء أو طاولة نظيفة)<br>ضوء النهار أفضل من الفلاش • قرّب الكاميرا حتى تملأ المادة المربع</div>
<div class="sq"><video id="vid" playsinline muted autoplay></video><i></i></div>
<div class="cbar"><button id="cx" aria-label="إغلاق">✕</button><button class="sh" id="shot" aria-label="التقاط"></button><button id="flip" aria-label="قلب الكاميرا">🔄</button></div>
</div>
<div class="toast" id="ts"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ===== الصق إعدادات Firebase هنا =====
const FIREBASE_CONFIG={
  apiKey:"AIzaSyAzJ5yGK6VKbjHBNw7PLMfdJkhIVkqJuQw",
  authDomain:"store-dad.firebaseapp.com",
  databaseURL:"https://store-dad-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"store-dad",
  storageBucket:"store-dad.firebasestorage.app",
  messagingSenderId:"520511845469",
  appId:"1:520511845469:web:8e261252cb05f6b06849b4"
};
const DB_PATH='dragh_store/items';          // مكان حفظ المواد في القاعدة
const EMAIL_DOMAIN='mutabaa.online';        // تحويل رقم الهاتف إلى بريد: رقم@الدومين
const $=id=>document.getElementById(id);
let db=null,items=[],editing=null,img=null;
const mem={};
function toast(m){const t=$('ts');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2000)}
let ref=null;
function put(o){return ref.child(o.id).set(o)}
function rem(id){return ref.child(id).remove()}
function toEmail(v){v=v.trim();return v.includes('@')?v:v.replace(/\D/g,'')+'@'+EMAIL_DOMAIN}
function start(){
  try{firebase.initializeApp(FIREBASE_CONFIG)}catch(e){$('lerr').textContent='إعدادات Firebase غير صحيحة';return}
  firebase.auth().onAuthStateChanged(u=>{
    if(ref){ref.off();ref=null}
    if(!u){items=[];render();$('lg').classList.add('on');return}
    $('lg').classList.remove('on');
    ref=firebase.database().ref(DB_PATH);
    ref.on('value',snap=>{
      items=Object.values(snap.val()||{});
      items.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));
      cats();render();
      if(cur&&$('ov2').classList.contains('on')){const n=items.find(i=>i.id===cur.id);if(n){cur=n;calcRes();amtRes()}}
    },err=>toast('خطأ بالقاعدة: '+err.code));
  });
}
async function login(){
  $('lerr').textContent='';
  try{await firebase.auth().signInWithEmailAndPassword(toEmail($('lph').value),$('lpw').value);$('lpw').value=''}
  catch(e){$('lerr').textContent='فشل الدخول: '+(e.code||e.message)}
}
const U=i=>i.u||((i.unit||'').includes('كيلو')?'kg':'pc');
const fmt=n=>n===''||n==null||isNaN(n)?'—':Number(n).toLocaleString('en-US');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function load(){}
function cats(){
  const cur=$('cf').value;const s=[...new Set(items.map(i=>i.cat).filter(Boolean))];
  $('cf').innerHTML='<option value="">كل الأصناف</option>'+s.map(c=>`<option>${esc(c)}</option>`).join('');
  $('cf').value=s.includes(cur)?cur:'';
}
function render(){
  const q=$('q').value.trim().toLowerCase(),cf=$('cf').value;
  const l=items.filter(i=>(!cf||i.cat===cf)&&(!q||(i.name||'').toLowerCase().includes(q)||(i.cat||'').toLowerCase().includes(q)));
  $('st').textContent=`${l.length} من ${items.length} مادة`;
  $('g').innerHTML=l.length?l.map(i=>`<div class="card" data-id="${i.id}"><div class="img" style="${i.img?`background-image:url(${i.img})`:''}">${i.img?'':'🛒'}</div><div class="b"><div class="n">${esc(i.name)}</div><div class="c">${esc(i.cat)}${U(i)=='kg'?' • للكيلو':''}${i.unit?' • '+esc(i.unit):''}</div><div class="p w"><span>جملة</span><b>${fmt(i.pw)}</b></div><div class="p r"><span>مفرد</span><b>${fmt(i.pr)}</b></div></div></div>`).join(''):
  `<div class="empty">${items.length?'لا توجد نتائج':'لا توجد مواد بعد.<br>اضغط + لإضافة أول مادة'}</div>`;
}
function show(id){
  editing=id?items.find(i=>i.id===id):null;
  $('mt').textContent=editing?'تعديل المادة':'مادة جديدة';
  $('nm').value=editing?.name||'';$('ct').value=editing?.cat||'';$('un').value=editing?.unit||'';
  $('uk').value=editing?U(editing):'kg';$('pc').value=editing?.cost??'';
  $('pw').value=editing?.pw??'';$('pr').value=editing?.pr??'';
  img=editing?.img||null;pv();$('dl').style.display=editing?'':'none';
  $('ov').classList.add('on');
}
function pv(){const p=$('pv');p.style.backgroundImage=img?`url(${img})`:'';p.textContent=img?'':'📷 لا توجد صورة'}
function hide(){$('ov').classList.remove('on')}
function finish(src,w,h){
  const S=Math.min(w,h),sx=(w-S)/2,sy=(h-S)/2,O=Math.min(S,560);
  const c=document.createElement('canvas');c.width=c.height=O;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,O,O);
  x.drawImage(src,sx,sy,S,S,0,0,O,O);
  if($('enh').checked){
    const d=x.getImageData(0,0,O,O),p=d.data,h2=new Array(256).fill(0),n=O*O;
    for(let i=0;i<p.length;i+=4)h2[(p[i]*.299+p[i+1]*.587+p[i+2]*.114)|0]++;
    let a=0,lo=0,hi=255;
    for(let v=0;v<256;v++){a+=h2[v];if(a>=n*.01){lo=v;break}}
    a=0;for(let v=255;v>=0;v--){a+=h2[v];if(a>=n*.01){hi=v;break}}
    if(hi-lo>40){
      const g=255/(hi-lo),cl=v=>v<0?0:v>255?255:v;
      for(let i=0;i<p.length;i+=4){
        const r=(p[i]-lo)*g,gg=(p[i+1]-lo)*g,b=(p[i+2]-lo)*g,L=r*.299+gg*.587+b*.114;
        p[i]=cl(L+(r-L)*1.12);p[i+1]=cl(L+(gg-L)*1.12);p[i+2]=cl(L+(b-L)*1.12);
      }
      x.putImageData(d,0,0);
    }
  }
  return c.toDataURL('image/jpeg',0.72);
}
function shrink(file){return new Promise((res,rej)=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};
  im.onload=()=>{URL.revokeObjectURL(u);res(finish(im,im.naturalWidth,im.naturalHeight))};
  im.src=u})}
let stream=null,facing='environment';
async function camOpen(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('cf2').click();return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1600},height:{ideal:1600}},audio:false});
    $('vid').srcObject=stream;$('cam').style.display='flex';await $('vid').play();
  }catch(e){camClose();$('cf2').click()}
}
function camClose(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $('vid').srcObject=null;$('cam').style.display='none';
}
$('pcam').onclick=camOpen;
$('pgal').onclick=()=>$('pf').click();
$('cx').onclick=camClose;
$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';camClose();camOpen()};
$('shot').onclick=()=>{
  const v=$('vid');if(!v.videoWidth)return;
  img=finish(v,v.videoWidth,v.videoHeight);pv();camClose();toast('تم التقاط الصورة ✓');
};

$('add').onclick=()=>show();
$('cn').onclick=hide;
$('ov').onclick=e=>{if(e.target===$('ov'))hide()};
$('g').onclick=e=>{const c=e.target.closest('.card');if(c)calc(c.dataset.id)};
$('q').oninput=render;$('cf').onchange=render;
$('pf').onchange=$('cf2').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{img=await shrink(f);pv()}catch(x){toast('تعذر قراءة الصورة')}e.target.value=''};
$('sv').onclick=async()=>{
  const name=$('nm').value.trim();
  if(!name){toast('أدخل اسم المادة');$('nm').focus();return}
  const o={id:editing?.id||('i'+Date.now()+Math.random().toString(36).slice(2,6)),name,cat:$('ct').value.trim(),unit:$('un').value.trim(),u:$('uk').value,cost:$('pc').value===''?'':Number($('pc').value),
    pw:$('pw').value===''?'':Number($('pw').value),pr:$('pr').value===''?'':Number($('pr').value),img,t:Date.now()};
  await put(o);hide();await load();toast('تم الحفظ ✓');
};
$('dl').onclick=async()=>{
  if(!editing)return;
  if(!confirm('حذف "'+editing.name+'" نهائياً؟'))return;
  await rem(editing.id);hide();await load();toast('تم الحذف');
};
$('exp').onclick=()=>{
  const b=new Blob([JSON.stringify({v:1,items},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='prices-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();toast('تم إنشاء النسخة');
};
$('imp').onclick=()=>$('impf').click();
$('impf').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());const l=Array.isArray(d)?d:d.items;
    if(!Array.isArray(l))throw 0;
    for(const o of l)if(o&&o.id&&o.name)await put(o);
    await load();toast('تم استرجاع '+l.length+' مادة')}catch(x){toast('ملف غير صالح')}
  e.target.value=''};
let cur=null;
const rnd=x=>$('rd').checked?Math.round(x/250)*250:Math.round(x);
function calc(id){
  cur=items.find(i=>i.id===id);if(!cur)return;
  const kg=U(cur)=='kg';
  $('cimg').style.backgroundImage=cur.img?`url(${cur.img})`:'';$('cimg').textContent=cur.img?'':'🛒';
  $('cnm').textContent=cur.name;
  $('cinf').textContent=(cur.cat||'')+(kg?' • الأسعار للكيلو الواحد':' • الأسعار للقطعة الواحدة')+(cur.unit?' • '+cur.unit:'');
  $('ql').textContent=kg?'الوزن بالغرام':'العدد';
  $('qty').value=kg?500:1;
  $('chips').innerHTML=(kg?[100,250,500,750,1000]:[1,2,3,6,12]).map(v=>`<button class="sec" data-v="${v}">${kg?(v>=1000?'1 كغم':v+' غم'):v}</button>`).join('');
  $('al').textContent=kg?'أو اكتب المبلغ بالدينار (كم غرام يأخذ؟)':'أو اكتب المبلغ بالدينار (كم قطعة يأخذ؟)';
  $('amt').value='';
  $('achips').innerHTML=[500,1000,2000,3000,5000,10000].map(v=>`<button class="sec" data-v="${v}">${fmt(v)}</button>`).join('');
  $('ov2').classList.add('on');calcRes();amtRes();
}
function calcRes(){
  if(!cur)return;
  const kg=U(cur)=='kg',q=parseFloat($('qty').value),f=kg?q/1000:q;
  if(!(q>0)){$('rsl').innerHTML='<div class="sub" style="margin-top:10px">أدخل الكمية</div>';return}
  const ok=v=>v!==''&&v!=null;
  const line=(l,p,c)=>`<div class="rs ${c}"><span>${l}</span><b>${ok(p)?fmt(rnd(p*f))+' د.ع':'—'}</b></div>`;
  let h=line('سعر الجملة',cur.pw,'w')+line('سعر المفرد',cur.pr,'r');
  if(ok(cur.cost)){
    h+=`<div class="rs"><span>سعر الشراء (التكلفة)</span><b>${fmt(Math.round(cur.cost*f))} د.ع</b></div>`;
    if(ok(cur.pr))h+=`<div class="rs r"><span>الربح من المفرد</span><b>${fmt(Math.round(rnd(cur.pr*f)-cur.cost*f))} د.ع</b></div>`;
    if(ok(cur.pw))h+=`<div class="rs w"><span>الربح من الجملة</span><b>${fmt(Math.round(rnd(cur.pw*f)-cur.cost*f))} د.ع</b></div>`;
  }
  $('rsl').innerHTML=h;
}
function amtRes(){
  if(!cur)return;
  const kg=U(cur)=='kg',a=parseFloat($('amt').value);
  if(!(a>0)){$('arsl').innerHTML='';return}
  const line=(l,p,c)=>{
    if(p===''||p==null||!(p>0))return `<div class="rs ${c}"><span>${l}</span><b>—</b></div>`;
    const q=a/p;
    return `<div class="rs ${c}"><span>${l}</span><b>${kg?fmt(Math.round(q*1000))+' غم':(Math.round(q*10)/10)+' قطعة'}</b></div>`};
  $('arsl').innerHTML=line('بسعر المفرد',cur.pr,'r')+line('بسعر الجملة',cur.pw,'w');
}
$('amt').oninput=amtRes;
$('achips').onclick=e=>{const b=e.target.closest('button');if(b){$('amt').value=b.dataset.v;amtRes()}};
$('qty').oninput=calcRes;$('rd').onchange=calcRes;
$('chips').onclick=e=>{const b=e.target.closest('button');if(b){$('qty').value=b.dataset.v;calcRes()}};
$('cc').onclick=()=>$('ov2').classList.remove('on');
$('ov2').onclick=e=>{if(e.target===$('ov2'))$('ov2').classList.remove('on')};
$('ce').onclick=()=>{$('ov2').classList.remove('on');show(cur.id)};
$('lgb').onclick=login;$('lpw').onkeydown=e=>{if(e.key==='Enter')login()};
$('lo').onclick=()=>firebase.auth().signOut();
start();
</script>
</body>
</html>
